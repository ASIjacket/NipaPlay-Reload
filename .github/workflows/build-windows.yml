name: Build Windows

on:
  push:
    branches:
      - build/ua-latest-windows-20260819
  # 允许在 Actions 页面手动触发，构建单独的 Windows 产物（无需走完整 release 流程）。
  workflow_dispatch:
    inputs:
      portable_only:
        description: '只生成可直接运行的 Windows 便携版'
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      portable_only:
        description: '只生成可直接运行的 Windows 便携版'
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: '应用版本号'
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: '构建产物名称'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Windows Package
    # Keep the release build on the VS 2022 SDK until Erika's Windows SMTC
    # bridge supports the C++/WinRT projection shipped by VS 2026.
    runs-on: windows-2022
    outputs:
      version: ${{ steps.setup.outputs.version }}
      artifact-name: release-Windows-x64
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FVP_DEPS_URL: https://sourceforge.net/projects/mdk-sdk/files/nightly
      # Keep FVP_DEPS_LATEST unset (treated as 0): with it on, fvp's deps.cmake
      # re-fetches mdk-sdk's .md5 from the SourceForge web frontend during
      # `flutter build windows`, and SourceForge serves an HTML interstitial to
      # CI runners that fatally breaks extraction. The mdk-sdk is pre-downloaded
      # by the build-windows action, so fvp must trust it and skip downloads.
      FVP_DEPS_LATEST: 0
      ERIKA_PREBUILT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Flutter Environment
        id: setup
        uses: ./.github/actions/setup-flutter

      - name: Generate build info json
        shell: pwsh
        run: python .github/workflows/scripts/generate-build-info-json.py assets/build_info.json
      
      - name: Build Windows Package
        uses: ./.github/actions/build-windows
        with:
          app-version: ${{ steps.setup.outputs.version }}
          portable-only: ${{ github.event_name == 'push' || inputs.portable_only }}

      - name: Upload portable Windows artifact
        if: github.event_name == 'push' || inputs.portable_only == true
        uses: actions/upload-artifact@v4
        with:
          name: NipaPlay-Windows-x64-portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Upload Windows release artifacts
        if: github.event_name != 'push' && inputs.portable_only != true
        uses: actions/upload-artifact@v4
        with:
          name: release-Windows-x64
          path: |
            build/windows/*
            !build/windows/symbols-windows

      - name: Upload Dart debug symbols (for de-obfuscating crash stacks)
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push' && inputs.portable_only != true
        with:
          name: dart-symbols-Windows
          path: build/symbols-windows/
          if-no-files-found: warn
