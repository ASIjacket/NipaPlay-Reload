name: Build Windows

on:
  # 允许在 Actions 页面手动触发，构建单独的 Windows 产物（无需走完整 release 流程）。
  workflow_dispatch:
    inputs:
      portable-only:
        description: '产物只保留免安装版（跳过安装器和 MSIX）'
        type: boolean
        default: true
  workflow_call:
    # 这里刻意不暴露 portable-only：release 需要安装器和 MSIX。未定义的 input
    # 在被调用时求值为空，下面的条件自然走完整产物分支。
    outputs:
      version:
        description: '应用版本号'
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: '构建产物名称'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Windows Package
    # Keep the release build on the VS 2022 SDK until Erika's Windows SMTC
    # bridge supports the C++/WinRT projection shipped by VS 2026.
    runs-on: windows-2022
    outputs:
      version: ${{ steps.setup.outputs.version }}
      artifact-name: release-Windows-x64
    env:
      FVP_DEPS_URL: https://sourceforge.net/projects/mdk-sdk/files/nightly
      # Keep FVP_DEPS_LATEST unset (treated as 0): with it on, fvp's deps.cmake
      # re-fetches mdk-sdk's .md5 from the SourceForge web frontend during
      # `flutter build windows`, and SourceForge serves an HTML interstitial to
      # CI runners that fatally breaks extraction. The mdk-sdk is pre-downloaded
      # by the build-windows action, so fvp must trust it and skip downloads.
      FVP_DEPS_LATEST: 0
      ERIKA_PREBUILT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          submodules: recursive
      
      - name: Setup Flutter Environment
        id: setup
        uses: ./.github/actions/setup-flutter

      - name: Generate build info json
        shell: pwsh
        run: python .github/workflows/scripts/generate-build-info-json.py assets/build_info.json
      
      - name: Build Windows Package
        uses: ./.github/actions/build-windows
        with:
          app-version: ${{ steps.setup.outputs.version }}
      
      - name: Clean flutter pub cache
        run: flutter pub cache clean
      
      # 手动构建：只要能直接运行的那份。这里传的是免安装目录本身而不是它的 zip，
      # artifact 下载下来本身就是 zip，再套一层就得解压两次才能跑。
      - name: Upload portable Windows build
        if: inputs.portable-only
        uses: actions/upload-artifact@v4
        with:
          name: release-Windows-x64
          path: build/windows/NipaPlay_*_Windows_x64/
          if-no-files-found: error

      # release 流程：三个发布物都要。注意不能传 build/windows/*，那样会连完整
      # 构建树 x64/ 和免安装目录一起打包，artifact 会涨到 1.2 GB，而 main.yml
      # 只取顶层的 *.zip / *.exe / *.msix。
      - name: Upload Windows Artifacts
        if: ${{ !inputs.portable-only }}
        uses: actions/upload-artifact@v4
        with:
          name: release-Windows-x64
          path: |
            build/windows/*.zip
            build/windows/*.exe
            build/windows/*.msix
          if-no-files-found: error

      - name: Upload Dart debug symbols (for de-obfuscating crash stacks)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-symbols-Windows
          path: build/symbols-windows/
          if-no-files-found: warn
